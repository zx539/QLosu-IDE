<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QLosu 量子编程 IDE</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- 标题栏 -->
  <div id="titlebar">
    <div class="brand">
      <svg class="brand-logo" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      <span class="brand-name">QLosu</span>
      <span class="brand-sub">量子编程 IDE</span>
    </div>
    <button class="btn" onclick="app.run()" title="运行 (Ctrl+Enter)">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      运行 <span class="kbd">Ctrl+Enter</span>
    </button>
    <button class="btn" onclick="app.saveFile()" title="保存 (Ctrl+S)">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"/></svg>
      保存 <span class="kbd">Ctrl+S</span>
    </button>
    <div class="spacer"></div>
    <select class="input" onchange="app.applyTheme(this.value)" id="theme-select">
      <option value="dark">深色主题</option>
      <option value="light">浅色主题</option>
      <option value="aurora">极光主题</option>
    </select>
  </div>

  <!-- 工作台 -->
  <div id="workbench">
    <!-- 活动栏 -->
    <div id="activitybar">
      <button class="ab-btn active" data-view="workspace" onclick="app.switchView('workspace')" title="工作区">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>
      </button>
      <button class="ab-btn" data-view="examples" onclick="app.switchView('examples')" title="示例">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
      </button>
    </div>

    <!-- 侧边栏 -->
    <div id="sidebar">
      <div class="side-view active" data-view="workspace">
        <div class="side-head">工作区<div class="spacer"></div></div>
        <div class="side-body">
          <div class="ws-root" id="ws-root-text"></div>
          <div id="ws-tree"></div>
        </div>
      </div>
      <div class="side-view" data-view="examples">
        <div class="side-head">示例</div>
        <div class="side-body" id="ex-list"></div>
      </div>
    </div>

    <div class="sash"></div>

    <!-- 编辑区 -->
    <div id="center">
      <div id="tabs"></div>
      <div id="editor-host">
        <div id="editor"></div>
        <div id="welcome">
          <div>
            <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            <p>欢迎使用 QLosu 量子编程 IDE</p>
            <p style="margin-top:6px;font-size:12px">从左侧打开示例或工作区文件开始编程</p>
          </div>
        </div>
      </div>

      <div class="sash-h"></div>

      <!-- 面板 -->
      <div id="panel">
        <div class="panel-tabs">
          <button class="ptab active" data-tab="output" onclick="app.switchPanelTab('output')">输出</button>
          <button class="ptab" data-tab="problems" onclick="app.switchPanelTab('problems')">问题<span class="badge" style="display:none">0</span></button>
        </div>
        <div class="pview active" id="output"></div>
        <div class="pview" id="problems"></div>
      </div>
    </div>

    <div class="sash"></div>

    <!-- 右侧栏 -->
    <div id="rightbar">
      <div class="right-tabs">
        <button class="rtab active" data-tab="circuit" onclick="app.switchRightTab('circuit')">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z"/></svg>
          量子线路
        </button>
        <button class="rtab" data-tab="flowchart" onclick="app.switchRightTab('flowchart')">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
          程序流程
        </button>
        <button class="rtab" data-tab="agent" onclick="app.switchRightTab('agent')">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/></svg>
          AI 助手
        </button>
      </div>

      <div class="rview active" data-tab="circuit">
        <div class="rtoolbar">
          <span class="label">寄存器</span>
          <select class="input" style="flex:1"><option>寄存器 #0</option></select>
        </div>
        <div class="diagram-host"></div>
        <div class="diagram-empty">请先运行代码</div>
        <div class="stepper" id="stepper" style="display:none">
          <button class="btn icon sm">◀</button>
          <input type="range" id="step-range" min="0" max="0" value="0">
          <button class="btn icon sm">▶</button>
          <span id="step-label" style="font-size:12px;white-space:nowrap">步骤 1 / 1</span>
        </div>
        <div class="state-view" id="state-view" style="display:none">
          <div class="state-title" id="state-title"></div>
          <div id="state-body"></div>
        </div>
      </div>

      <div class="rview" data-tab="flowchart">
        <div class="diagram-host"></div>
        <div class="diagram-empty">流程图将在运行后显示</div>
      </div>

      <div class="rview" data-tab="agent">
        <div id="chat"></div>
        <div class="composer">
          <textarea class="input" id="composer-input" placeholder="输入问题（当前功能未完成，请稍后使用）" disabled></textarea>
          <div class="composer-row">
            <label><input type="checkbox" id="agent-context"> 附带代码上下文</label>
            <div class="spacer"></div>
            <button class="btn sm primary" disabled>发送</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- 状态栏 -->
  <div id="statusbar">
    <div class="sb-item" id="sb-version"></div>
    <div class="sb-item" id="sb-pos">第 1 行 1 列</div>
  </div>

  <script>
    document.getElementById('theme-select').value = localStorage.getItem('qlosu_theme') || 'dark';
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); app.run(); }
      if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); app.saveFile(); }
    });
  </script>
  <script src="vendor/monaco/vs/loader.js"></script>
  <script src="vendor/drawio/viewer-static.min.js"></script>
  <script src="js/core/trace.js"></script>
  <script src="js/core/losu-parse.js"></script>
  <script src="js/core/drawio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
