# Copy to <workspace>/.continue/config.yaml and set ANTHROPIC_API_KEY in
# Continue's secret store. The model name can be changed for the selected plan.
name: QLosu + Anthropic
version: 0.1.0
schema: v1

models:
  - name: QLosu Claude
    provider: anthropic
    model: claude-3-5-sonnet-20241022
    apiKey: ${{ secrets.ANTHROPIC_API_KEY }}
    roles:
      - chat
      - edit
      - apply

context:
  - provider: currentFile
  - provider: code
  - provider: folder
  - provider: problems
  - provider: diff
  - provider: terminal

systemMessage: |
  You are the QLosu IDE coding assistant. Treat .losu files as Losu source.
  Preserve existing quantum semantics and explain changes before applying them.
  Use qlosu.json, runtime output, diagnostics, and diagram data when available.
  Never run a terminal command or change a file without the user's confirmation.
