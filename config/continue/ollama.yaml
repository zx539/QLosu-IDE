# Copy to <workspace>/.continue/config.yaml.
# Ollama runs locally; no API key is required.
name: QLosu + Ollama
version: 0.1.0
schema: v1

models:
  - name: QLosu Ollama Coder
    provider: ollama
    model: qwen2.5-coder:7b
    roles:
      - chat
      - edit
      - apply

context:
  - provider: currentFile
  - provider: code
  - provider: folder
  - provider: problems
  - provider: diff
  - provider: terminal

systemMessage: |
  You are the QLosu IDE coding assistant. Treat .losu files as Losu source.
  Preserve existing quantum semantics and explain changes before applying them.
  Use qlosu.json, runtime output, diagnostics, and diagram data when available.
  Never run a terminal command or change a file without the user's confirmation.
